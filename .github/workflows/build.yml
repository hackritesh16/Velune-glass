name: Build Velune APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK type"
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

concurrency:
  group: velune-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract Velune source
        run: |
          test -f Velune-1.1.2-glass-redesign.zip
          unzip -q Velune-1.1.2-glass-redesign.zip
          test -f Velune-1.1.2/gradlew
          chmod +x Velune-1.1.2/gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (release builds only)
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p Velune-1.1.2/app/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > Velune-1.1.2/app/keystore/release.keystore
          else
            echo "KEYSTORE_BASE64 secret not set; release APK may be unsigned"
          fi

      - name: Unit tests
        working-directory: Velune-1.1.2
        run: ./gradlew testUniversalDebugUnitTest --stacktrace

      - name: Build APK
        working-directory: Velune-1.1.2
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleUniversalRelease --stacktrace
          else
            ./gradlew assembleUniversalDebug --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: velune-glass-apk
          path: Velune-1.1.2/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
