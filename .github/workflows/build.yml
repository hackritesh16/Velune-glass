name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options: [debug, release]
        default: debug

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # BEGIN ONE-TIME SOURCE MIGRATION
      - name: Import source ZIP into repository
        shell: bash
        run: |
          set -euo pipefail
          ZIP="velune-source.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Source ZIP already removed; using repository source"
            echo "SRC=$PWD" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/velune-unpacked"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/velune-unpacked"
          ROOT=$(find "$RUNNER_TEMP/velune-unpacked" -maxdepth 4 -type f -name gradlew -print -quit)
          [ -n "$ROOT" ] || { echo "No gradlew inside ZIP"; exit 1; }
          ROOT=$(dirname "$ROOT")
          rsync -a --exclude='.git' --exclude='.github/workflows/build.yml' "$ROOT/" "$PWD/"
          chmod +x gradlew
          git rm -f -- "$ZIP"
          python3 - <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/build.yml")
          s = p.read_text()
          a = s.index("      # BEGIN ONE-TIME SOURCE MIGRATION")
          b = s.index("      # END ONE-TIME SOURCE MIGRATION") + len("      # END ONE-TIME SOURCE MIGRATION\n")
          s = s[:a] + '      - name: Locate project\n        run: echo "SRC=$PWD" >> "$GITHUB_ENV"\n\n' + s[b:]
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import unpacked Velune Android source and remove ZIP extraction"
          git push origin HEAD:main
          echo "SRC=$PWD" >> "$GITHUB_ENV"
      # END ONE-TIME SOURCE MIGRATION

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The source zip ships gradle-wrapper.jar but not gradle-wrapper.properties.
      - name: Ensure Gradle wrapper properties
        run: |
          cd "$SRC"
          chmod +x gradlew
          P=gradle/wrapper/gradle-wrapper.properties
          if [ ! -f "$P" ]; then
            mkdir -p gradle/wrapper
            cat > "$P" <<'PROPS'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPS
            sed -i 's/^ *//' "$P"
            echo "Generated $P"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (release builds only)
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p "$SRC/app/keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$SRC/app/keystore/release.keystore"
          else
            echo "KEYSTORE_BASE64 secret not set; release APK will be unsigned"
          fi

      - name: Build APK
        run: |
          cd "$SRC"
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleUniversalRelease --stacktrace
          else
            ./gradlew assembleUniversalDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: velune-apk
          path: ${{ env.SRC }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
