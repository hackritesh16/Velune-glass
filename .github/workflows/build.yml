name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options: [debug, release]
        default: debug

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Works whether the repo holds the project directly OR just a .zip of it.
      - name: Locate / extract project
        run: |
          if [ -f gradlew ]; then
            SRC="$PWD"
          else
            ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" -not -path "./.git/*" | head -n 1)
            [ -n "$ZIP" ] || { echo "No gradlew and no .zip found in repo"; exit 1; }
            echo "Extracting $ZIP"
            mkdir -p "$RUNNER_TEMP/src"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/src"
            GW=$(find "$RUNNER_TEMP/src" -maxdepth 3 -name gradlew | head -n 1)
            [ -n "$GW" ] || { echo "gradlew not found inside zip"; exit 1; }
            SRC=$(dirname "$GW")
          fi
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo "Project root: $SRC"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The source zip ships gradle-wrapper.jar but not gradle-wrapper.properties.
      - name: Ensure Gradle wrapper properties
        run: |
          cd "$SRC"
          chmod +x gradlew
          P=gradle/wrapper/gradle-wrapper.properties
          if [ ! -f "$P" ]; then
            mkdir -p gradle/wrapper
            cat > "$P" <<'PROPS'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPS
            sed -i 's/^ *//' "$P"
            echo "Generated $P"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (release builds only)
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p "$SRC/app/keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$SRC/app/keystore/release.keystore"
          else
            echo "KEYSTORE_BASE64 secret not set; release APK will be unsigned"
          fi

      - name: Build APK
        run: |
          cd "$SRC"
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleUniversalRelease --stacktrace
          else
            ./gradlew assembleUniversalDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: velune-apk
          path: ${{ env.SRC }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
